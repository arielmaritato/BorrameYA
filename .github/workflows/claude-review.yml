name: Claude Code Review - MANUAL

on:
  workflow_dispatch:

jobs:
  claude-review:
    runs-on: ubuntu-latest
    steps:
      - name: "1️⃣ Checkout code"
        uses: actions/checkout@v3

      - name: "2️⃣ Setup Node"
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: "3️⃣ Install Anthropic SDK"
        run: npm install @anthropic-ai/sdk

      - name: "4️⃣ Analyze with Claude"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          node -e "
          const Anthropic = require('@anthropic-ai/sdk');
          const client = new Anthropic();
          
          (async () => {
            const message = await client.messages.create({
              model: 'claude-3-5-sonnet-20241022',
              max_tokens: 1024,
              messages: [
                {
                  role: 'user',
                  content: 'Eres un code reviewer experto. Este es un repositorio educativo de GitHub Actions. Reporta: 1) Configuración, 2) Mejoras potenciales. Sé breve.'
                }
              ]
            });
            console.log('🔍 Análisis de Claude:');
            console.log(message.content[0].text);
          })();
          "

      - name: "5️⃣ Workflow Complete"
        run: echo "✅ Análisis completado exitosamente"